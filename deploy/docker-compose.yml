# =============================================
# 远东工友 App — Docker Compose 编排
# =============================================
# 启动: docker compose up -d
# 查看: docker compose ps
# 日志: docker compose logs -f backend
# 停止: docker compose down
# =============================================

services:
  # ============= PostgreSQL 数据库 =============
  postgres:
    image: postgres:15-alpine
    container_name: fareast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fareast_worker}
      POSTGRES_USER: ${POSTGRES_USER:-fareast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # 时区
      TZ: Asia/Hong_Kong
    volumes:
      # 数据持久化
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本（首次启动执行）
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - fareast-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fareast} -d ${POSTGRES_DB:-fareast_worker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============= Redis 缓存 =============
  redis:
    image: redis:7-alpine
    container_name: fareast-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      # 数据持久化（AOF + RDB）
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - fareast-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ============= Spring Boot 后端 =============
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: fareast-backend:latest
    container_name: fareast-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Spring 激活 Docker 配置
      SPRING_PROFILES_ACTIVE: docker
      # 数据库连接（使用 Docker 网络服务名）
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fareast_worker}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Hong_Kong
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fareast}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # 短信
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-SMS_335260681}
      # 飞书
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      # 时区
      TZ: Asia/Hong_Kong
    volumes:
      # 上传文件持久化
      - uploads-data:/app/uploads
      # 日志持久化
      - logs-data:/app/logs
    # 后端不直接暴露端口，仅通过 Nginx 反向代理访问
    expose:
      - "8080"
    networks:
      - fareast-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============= Nginx 反向代理 + TLS 终止 =============
  nginx:
    image: nginx:1.27-alpine
    container_name: fareast-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "10443:10443"
    volumes:
      # Nginx 配置
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书（首次启动使用自签名占位，后续替换为 Let's Encrypt 证书）
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Let's Encrypt ACME 验证
      - certbot-webroot:/var/www/certbot
      # 静态页面（API 测试面板等）
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - fareast-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ============= Certbot (Let's Encrypt 证书自动续期) =============
  certbot:
    image: certbot/certbot:latest
    container_name: fareast-certbot
    volumes:
      # 证书输出目录
      - ./nginx/ssl:/etc/letsencrypt/live/${DOMAIN:-fsapp.fefacade.com}:rw
      # ACME 验证目录
      - certbot-webroot:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h; done'"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

# ============= 卷 =============
volumes:
  pgdata:
    name: fareast-pgdata
    driver: local
  redis-data:
    name: fareast-redis-data
    driver: local
  uploads-data:
    name: fareast-uploads
    driver: local
  logs-data:
    name: fareast-logs
    driver: local
  certbot-webroot:
    name: fareast-certbot-webroot
    driver: local

# ============= 网络 =============
networks:
  fareast-net:
    name: fareast-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
