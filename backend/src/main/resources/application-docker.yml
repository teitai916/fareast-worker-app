# =============================================
# Docker 部署环境配置
# 敏感值通过环境变量注入，此文件只包含非敏感的版本化配置
# 环境变量在 docker-compose.yml / .env 中定义
# =============================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 300000
      connection-timeout: 10000

  redis:
    host: ${SPRING_REDIS_HOST}
    port: 6379
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: 3000
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 7776000000
  refresh-expiration: 2592000000

# 短信（阿里云）
sms:
  provider: aliyun
  access-key-id: ${SMS_ACCESS_KEY_ID:}
  access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
  sign-name: 远东工友
  template-code: ${SMS_TEMPLATE_CODE:SMS_335260681}

# 人脸识别（已废弃，预留）
face:
  provider: baidu
  app-id: ${FACE_APP_ID:}
  api-key: ${FACE_API_KEY:}
  secret-key: ${FACE_SECRET_KEY:}
  verification-threshold: 65

# 飞书
feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}

# 生产日志级别
logging:
  level:
    com.fareast.worker: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    path: /app/logs

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
