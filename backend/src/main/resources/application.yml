server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-swallow-size: 50MB

spring:
  application:
    name: fareast-worker-app
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    timezone: Asia/Hong_Kong
    default-property-inclusion: non_null

  mvc:
    static-path-pattern: /uploads/**

  web:
    resources:
      static-locations: file:/data/uploads/

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
      enabled: true

# 文件上传目录
file:
  upload-dir: /data/uploads

# 打卡地理围栏
checkin:
  max-distance: 300

logging:
  level:
    com.fareast.worker: DEBUG
    org.springframework.security: INFO
    org.hibernate: WARN
