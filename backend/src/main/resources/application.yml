server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-swallow-size: 50MB

spring:
  application:
    name: fareast-worker-app
  profiles:
    # 默认不激活任何 profile，由环境变量 SPRING_PROFILES_ACTIVE 控制
    # 本地开发: 在 IDE 中设置 SPRING_PROFILES_ACTIVE=dev
    # Docker: docker-compose.yml 中已设置 SPRING_PROFILES_ACTIVE=docker
    active: ${SPRING_PROFILES_ACTIVE:}

  # Redis 基础配置（会被 profile 或 env var 覆盖）
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: 6379
    password: ${SPRING_REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    timezone: Asia/Hong_Kong
    default-property-inclusion: non_null

  mvc:
    static-path-pattern: /uploads/**

  web:
    resources:
      static-locations: file:./uploads/

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
      enabled: true

# 文件上传目录
file:
  upload-dir: ./uploads

# 打卡地理围栏
checkin:
  max-distance: 300

logging:
  level:
    com.fareast.worker: DEBUG
    org.springframework.security: INFO
    org.hibernate: WARN
