name: iOS Build & TestFlight

on:
  # 手动触发（最常用）
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'TestFlight'
        type: choice
        options:
          - 'TestFlight'
          - 'AdHoc'

  # 推送 tag 时自动构建（可选，按需启用）
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build:
    name: Build IPA and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ===================== 设置 Flutter =====================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      # ===================== 固定 Xcode 版本 =====================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ===================== Flutter 构建 =====================
      - name: Get Flutter packages
        working-directory: frontend
        run: flutter pub get

      - name: Build iOS release (prepare .app)
        working-directory: frontend
        run: flutter build ios --release --no-codesign

      # ===================== 准备证书和配置文件 (Fastlane Match) =====================
      - name: Setup Ruby/Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: frontend

      - name: Create temporary keychain
        run: |
          security create-keychain -p temp_keychain_pass fastlane_match
          security default-keychain -s fastlane_match
          security unlock-keychain -p temp_keychain_pass fastlane_match
          security set-keychain-settings -lut 900 fastlane_match

      - name: Sync signing certificates (Fastlane Match)
        working-directory: frontend
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_KEYCHAIN_NAME: "fastlane_match"
          MATCH_KEYCHAIN_PASSWORD: "temp_keychain_pass"
        run: |
          bundle exec fastlane match appstore --readonly

      # ===================== 签名并导出 IPA =====================
      - name: Archive and export IPA
        working-directory: frontend
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_KEYCHAIN_NAME: "fastlane_match"
          MATCH_KEYCHAIN_PASSWORD: "temp_keychain_pass"
        run: |
          bundle exec fastlane build_and_export

      # ===================== 上传到 App Store Connect / TestFlight =====================
      - name: Upload to TestFlight
        working-directory: frontend
        env:
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: true
        run: |
          bundle exec fastlane upload_testflight

      # ===================== 通知 =====================
      - name: Upload IPA as artifact (备存)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fareast-worker-ipa
          path: frontend/build/ios/ipa/*.ipa
          retention-days: 7
