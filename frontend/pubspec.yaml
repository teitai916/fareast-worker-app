name: fareast_worker_app
description: 遠東工友通 - 香港建築工地工人安全管理平台，由遠東幕牆打造
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.2.0
  dio: ^5.4.0

  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Biometric authentication
  local_auth: ^2.3.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Location & Bluetooth
  geolocator: ^11.0.0
  flutter_blue_plus: ^1.30.0
  flutter_beacon: ^0.5.0

  # Camera & Face
  camera: ^0.10.5
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # Video player
  video_player: ^2.8.2
  chewie: ^1.7.4

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Web content display
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Lottie animations
  lottie: ^3.1.0

  # App shortcuts (long-press icon quick actions)
  quick_actions: ^1.1.0

  # Local notifications for check-in reminders
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo_primary.png
    - assets/images/logo_vertical_en.png
    - assets/images/logo_horizontal_cn_en.png
    - assets/images/logo_vertical_cn.png
    - assets/images/logo_horizontal_cn_en_white.png
    - assets/animations/
