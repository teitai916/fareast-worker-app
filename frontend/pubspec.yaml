name: fareast_worker_app
description: 远东工友 - 香港建筑工地工人安全管理平台
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.2.0
  dio: ^5.4.0

  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Location & Bluetooth
  geolocator: ^11.0.0
  flutter_blue_plus: ^1.30.0

  # Camera & Face
  camera: ^0.10.5
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # Video player
  video_player: ^2.8.2
  chewie: ^1.7.4

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  # Web content display
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Lottie animations
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
